<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedtest Results Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
        }

        .controls {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
        }

        .control-group label {
            margin-right: 10px;
            font-weight: bold;
        }

        select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #dee2e6;
            font-size: 14px;
            min-width: 200px;
        }

        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 14px;
        }

        .graphs-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .graph-box {
            flex: 1;
            min-width: 45%;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            height: 500px;
        }

        .scroll-container {
            width: 100%;
            overflow-x: auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
        }

        table {
            border-collapse: collapse;
            font-size: 14px;
            width: 100%;
        }

        th, td {
            padding: 12px 16px;
            border: 1px solid #dee2e6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            background-color: #f8f9fa;
            text-align: left;
            position: sticky;
            top: 0;
            cursor: pointer;
            z-index: 10;
            font-weight: 600;
        }

        th:hover {
            background-color: #e9ecef;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .numeric {
            text-align: right;
        }

        #lastUpdate {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 1000;
        }

        @media (max-width: 768px) {
            .graph-box {
                min-width: 100%;
            }
            
            .stat-box {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="control-group">
            <div>
                <label for="periodSelect">Période :</label>
                <select id="periodSelect" onchange="handlePeriodChange()">
                    <option value="all">Toutes les données</option>
                    <option value="day">24 dernières heures</option>
                    <option value="week">7 derniers jours</option>
                    <option value="month">30 derniers jours</option>
                    <option value="6months">6 derniers mois</option>
                    <option value="year">Dernière année</option>
                </select>
            </div>
        </div>
    </div>

    <div class="stats-container">
        <div class="stat-box">
            <div class="stat-value" id="avgDownload">-</div>
            <div class="stat-label">Download moyen (Mbps)</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="maxDownload">-</div>
            <div class="stat-label">Download max (Mbps)</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="avgUpload">-</div>
            <div class="stat-label">Upload moyen (Mbps)</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="maxUpload">-</div>
            <div class="stat-label">Upload max (Mbps)</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="avgPing">-</div>
            <div class="stat-label">Ping moyen (ms)</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="totalPacketLoss">-</div>
            <div class="stat-label">Paquets perdus (total)</div>
        </div>
        <div class="stat-box">
            <div class="stat-value" id="avgPacketLoss">-</div>
            <div class="stat-label">Paquets perdus (moyenne %)</div>
        </div>
    </div>

    <div class="graphs-container">
        <div class="graph-box">
            <canvas id="speedChart"></canvas>
    </div>

    <div class="scroll-container">
        <table id="dataTable">
            <thead>
                <tr id="headers"></tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
    <div id="lastUpdate"></div>

<script>
    let currentSortColumn = null;
    let isAscending = true;
    let lastData = null;
    let speedChart = null;
    let pingChart = null;
    let currentPeriod = 'all';

    function parseCSV(csv) {
        const lines = csv.split('\n').filter(line => line.trim() !== '');
        const headers = lines[0].split(',').map(header => header.replace(/"/g, ''));
        
        const rows = lines.slice(1).map(line => {
            const values = line.split(',').map(value => value.replace(/"/g, ''));
            return headers.reduce((obj, header, index) => {
                obj[header] = values[index];
                return obj;
            }, {});
        });
        return { headers, rows };
    }

    function isNumeric(str) {
        if (str === undefined || str === null) return false;
        return !isNaN(str) && !isNaN(parseFloat(str));
    }

    function formatNumber(value) {
        if (!isNumeric(value)) return value;
        const num = parseFloat(value);
        if (num >= 1000000) {
            return (num / 1000000).toFixed(2) + ' M';
        }
        if (num >= 1000) {
            return (num / 1000).toFixed(2) + ' K';
        }
        return num.toFixed(2);
    }

    function filterDataByPeriod(data, period) {
        const now = new Date();
        const periods = {
            day: 24 * 60 * 60 * 1000,
            week: 7 * 24 * 60 * 60 * 1000,
            month: 30 * 24 * 60 * 60 * 1000,
            '6months': 180 * 24 * 60 * 60 * 1000,
            year: 365 * 24 * 60 * 60 * 1000,
            all: Infinity
        };

        if (period === 'all') return data;

        const cutoff = new Date(now - periods[period]);
        return data.filter(row => {
            const [datePart, timePart] = row.date.split(' ');
            const [day, month, year] = datePart.split('/');
            const [hours, minutes, seconds] = timePart.split(':');
            const rowDate = new Date(year, month - 1, day, hours, minutes, seconds);
            return rowDate >= cutoff;
        });
    }

    function calculateStats(data) {
        if (!data || data.length === 0) return {
            avgDownload: 0,
            maxDownload: 0,
            avgUpload: 0,
            maxUpload: 0,
            avgPing: 0,
            totalPacketLoss: 0,
            avgPacketLoss: 0
        };

        const download = data.map(row => parseFloat(row.download) / 1000000);
        const upload = data.map(row => parseFloat(row.upload) / 1000000);
        const ping = data.map(row => parseFloat(row['idle latency']));
        const packetLoss = data.map(row => parseFloat(row['packet loss'] || 0)); // Ajout de cette ligne
        const totalLoss = packetLoss.reduce((a, b) => a + b, 0);
        const avgLoss = (totalLoss / packetLoss.length) * 100; // Conversion en pourcentage

        return {
            avgDownload: download.reduce((a, b) => a + b, 0) / download.length,
            maxDownload: Math.max(...download),
            avgUpload: upload.reduce((a, b) => a + b, 0) / upload.length,
            maxUpload: Math.max(...upload),
            avgPing: ping.reduce((a, b) => a + b, 0) / ping.length,
            totalPacketLoss: totalLoss,
            avgPacketLoss: avgLoss
        };
    }

    function updateStats(stats) {
        document.getElementById('avgDownload').textContent = `${formatNumber(stats.avgDownload)}`;
        document.getElementById('maxDownload').textContent = `${formatNumber(stats.maxDownload)}`;
        document.getElementById('avgUpload').textContent = `${formatNumber(stats.avgUpload)}`;
        document.getElementById('maxUpload').textContent = `${formatNumber(stats.maxUpload)}`;
        document.getElementById('avgPing').textContent = `${formatNumber(stats.avgPing)}`;
        document.getElementById('totalPacketLoss').textContent = `${formatNumber(stats.totalPacketLoss)}`;
        document.getElementById('avgPacketLoss').textContent = `${formatNumber(stats.avgPacketLoss)}%`;
    }

    function sortData(data, column) {
        return data.sort((a, b) => {
            let aVal = a[column];
            let bVal = b[column];
            
            if (column === 'date') {
                const parseDateString = (dateStr) => {
                    const [datePart, timePart] = dateStr.split(' ');
                    const [day, month, year] = datePart.split('/');
                    const [hours, minutes, seconds] = timePart.split(':');
                    return new Date(year, month - 1, day, hours, minutes, seconds);
                };

                const dateA = parseDateString(aVal);
                const dateB = parseDateString(bVal);

                return isAscending ? dateA - dateB : dateB - dateA;
            }
            
            if (isNumeric(aVal) && isNumeric(bVal)) {
                aVal = parseFloat(aVal);
                bVal = parseFloat(bVal);
            }

            if (aVal < bVal) return isAscending ? -1 : 1;
            if (aVal > bVal) return isAscending ? 1 : -1;
            return 0;
        });
    }

    function updateCharts(data) {
        const sortedData = sortData([...data], 'date');
        const dates = sortedData.map(row => row.date);
        const download = sortedData.map(row => parseFloat(row.download) / 1000000); // Conversion en Mbps
        const upload = sortedData.map(row => parseFloat(row.upload) / 1000000); // Ajout de l'upload
        const ping = sortedData.map(row => parseFloat(row['idle latency']));
        
        if (speedChart) speedChart.destroy();
        speedChart = new Chart(document.getElementById('speedChart'), {
            type: 'line',
            data: {
                labels: dates,
                datasets: [
                    {
                        label: 'Download (Mbps)',
                        data: download,
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1,
                        pointRadius: 2,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Upload (Mbps)',
                        data: upload,
                        borderColor: 'rgb(255, 99, 132)', // Rouge pour l'upload
                        tension: 0.1,
                        pointRadius: 2,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Latence (ms)',
                        data: ping,
                        borderColor: 'rgb(153, 102, 255)',
                        tension: 0.1,
                        pointRadius: 2,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'Vitesse et Latence',
                        font: {
                            size: 16
                        }
                    },
                    legend: {
                        position: 'top'
                    }
                },
                scales: {
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        min: 0,
                        max: 1000,
                        title: {
                            display: true,
                            text: 'Vitesse (Mbps)'
                        }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        min: 0,
                        max: 100,
                        title: {
                            display: true,
                            text: 'Latence (ms)'
                        },
                        grid: {
                            drawOnChartArea: false // Pour éviter la superposition des grilles
                        }
                    },
                    x: {
                        ticks: {
                            maxRotation: 45,
                            minRotation: 45
                        }
                    }
                },
                interaction: {
                    mode: 'index',
                    intersect: false
                }
            }
        });
    }

    function renderTable(headers, rows) {
        const headerRow = document.getElementById('headers');
        headerRow.innerHTML = headers.map(header => `
            <th onclick="handleSort('${header}')" class="${currentSortColumn === header ? (isAscending ? 'sort-asc' : 'sort-desc') : ''}">
                ${header}
                ${currentSortColumn === header ? 
                    `<span style="margin-left: 5px">${isAscending ? '↑' : '↓'}</span>` : 
                    ''}
            </th>
        `).join('');

        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = rows.map(row => `
            <tr>
                ${headers.map(header => `
                    <td class="${isNumeric(row[header]) ? 'numeric' : ''}">${
                        header === 'date' ? row[header] : 
                        formatNumber(row[header]) // Les valeurs sont déjà en Mbps
                    }</td>
                `).join('')}
            </tr>
        `).join('');

        document.getElementById('lastUpdate').textContent = 
            `Dernière mise à jour : ${new Date().toLocaleTimeString()}`;
    }

    function handleSort(column) {
        if (currentSortColumn === column) {
            isAscending = !isAscending;
        } else {
            currentSortColumn = column;
            isAscending = true;
        }
        
        if (lastData) {
            const filteredData = filterDataByPeriod(lastData.rows, currentPeriod);
            const sortedData = sortData(filteredData, column);
            renderTable(lastData.headers, sortedData);
        }
    }

    function handlePeriodChange() {
        currentPeriod = document.getElementById('periodSelect').value;
        if (lastData) {
            const filteredData = filterDataByPeriod(lastData.rows, currentPeriod);
            updateCharts(filteredData);
            const stats = calculateStats(filteredData);
            updateStats(stats);
            if (currentSortColumn) {
                const sortedData = sortData(filteredData, currentSortColumn);
                renderTable(lastData.headers, sortedData);
            } else {
                renderTable(lastData.headers, filteredData);
            }
        }
    }

    async function fetchAndUpdateData() {
        try {
            const response = await fetch('speedtest.log');
            const csvText = await response.text();
            const data = parseCSV(csvText);
            
            if (JSON.stringify(data) !== JSON.stringify(lastData)) {
                lastData = data;
                const filteredData = filterDataByPeriod(data.rows, currentPeriod);
                
                if (currentSortColumn) {
                    const sortedData = sortData(filteredData, currentSortColumn);
                    renderTable(data.headers, sortedData);
                } else {
                    renderTable(data.headers, filteredData);
                }
                
                updateCharts(filteredData);
                const stats = calculateStats(filteredData);
                updateStats(stats);
            }
        } catch (error) {
            console.error('Erreur lors de la lecture du fichier:', error);
        }
    }

    fetchAndUpdateData();
    setInterval(fetchAndUpdateData, 5000);
</script>
</body>
</html>
